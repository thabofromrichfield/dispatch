plugins {
    id 'com.android.application'
}

android {
    namespace 'za.co.dispatch.field'
    compileSdk 35

    defaultConfig {
        applicationId 'za.co.dispatch.field'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

// The field web app under android/field-app is the editable source; app/src/main/assets is its
// build output. Regenerate it before every build so an APK can never ship stale JavaScript.
tasks.register('syncFieldAssets', Exec) {
    description = 'Copies android/field-app and native-bridge.js into app/src/main/assets'
    workingDir rootProject.projectDir.parentFile
    commandLine 'sh', 'scripts/sync-android-assets.sh'
}

tasks.named('preBuild') { dependsOn 'syncFieldAssets' }
